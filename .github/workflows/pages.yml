name: Refresh data and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore TVMaze cache
        if: github.event_name != 'push'
        uses: actions/cache@v6
        with:
          path: data-cache
          key: tvmaze-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tvmaze-${{ runner.os }}-

      - name: Refresh finale data
        if: github.event_name != 'push'
        run: npm run refresh

      - name: Test and validate
        run: npm run check

      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- site/data/finales.json site/feed.xml; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/finales.json site/feed.xml
          git commit -m "Refresh finale data"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
